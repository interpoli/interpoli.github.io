site_name: Grupo de Pesquisa INTERPOLI
site_url: https://interpoli.github.io/
site_author: Larissa Alves
site_description: Website oficial do laboratório INTERPOLI da Universidade de São Paulo

theme:
  name: material
  language: pt-BR
  logo: assets/logo-branco.png    # Esse altera o ícone de livro da barra azul para o logo branco
  favicon: assets/logo.png        # Esse altera o ícone de livro da aba do Google para o logo escuro
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs        # Menu horizontal bonito no topo
    - navigation.tabs.sticky # Mantém o menu preso no topo
    - navigation.indexes     # Transforma subitens em menus suspensos no topo
    - search.expand         # Faz a barra de pesquisa ficar aberta e elegante no topo igual ao padrão comercial
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Início: index.md
  - Pesquisadores: pesquisadores.md
  - Pesquisas:
      - "Estudo empírico das demandas envolvendo pessoas com deficiência: jurimetria para a proposição de ações eficientes": pesquisas/pesquisa-silvasantos.md
      - "Representações do racismo na produção científica global: estudo bibliométrico em bases de dados internacionais": pesquisas/pesquisa-souza.md
      - "Mapeamento das iniciativas federais de Ciência Aberta no Brasil e das políticas nacionais de Ciência Aberta na Europa: implicações para a abertura de dados": pesquisas/pesquisa-alves.md
      - "Políticas editoriais e integridade científica no contexto do LATINDEX: desafios do uso de inteligência artificial na comunicação científica": pesquisas/pesquisa-ricardo.md
      - "Índice de Maturidade Ética (IME): proposta de um instrumento para avaliação de documentos institucionais de integridade científica em universidades brasileiras": pesquisas/pesquisa-sousa.md
      - "A organização do conhecimento em projetos fomentados pela FAPESP": pesquisas/pesquisa-camargo.md
      - "Métricas de remoções: estruturando um sistema de informação geográfica sobre habitação e risco na RMSP": pesquisas/pesquisa-ishihara.md
      - "Economia criativa e governança de dados: desafios e soluções inteligentes para o fomento cultural paulista": pesquisas/pesquisa-santos.md
      - "Ética e integridade científica na comunicação da ciência: análise das matérias publicadas na Revista Pesquisa FAPESP": pesquisas/pesquisa-bertanha.md
  - Outros projetos:
      - "EMU Infraestrutura de Pesquisa em Acervos Museológicos, Bibliográficos e Arquivísticos: aquisição de scanner profissional zeutschel para digitalização e modernização de coleções de acervos históricos da região de Ribeirão Preto": outros-projetos/projeto-silvasantos.md
  - Ciência em Pauta:
      - "De onde vêm as regras da ciência? uma discussão sobre integridade científica": ciencia-em-pauta/texto1.md
  - Biblioteca:
      - "Leitura": biblioteca/leitura.md
  - Canais: canais.md

